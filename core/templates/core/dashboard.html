{% load static compress %}
<!DOCTYPE html>
<html lang="en" class="dark" data-theme="{{ request.user.theme|default:'device' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flamingo Fitness</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="theme-color" content="#FF5E9A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flamingo">
    <meta name="description" content="A Duolingo-style fitness app: streaks, skill trees, and a Miami beach-club base.">
    <link rel="icon" href="{% static 'core/icons/icon-192.svg' %}" type="image/svg+xml">
    <!-- iOS home-screen icon (180x180 PNG; add to /static/core/icons/apple-touch-icon.png) -->
    <link rel="apple-touch-icon" href="{% static 'core/icons/apple-touch-icon.png' %}">
    <!-- Theme controller: resolves light/dark/device/time BEFORE first paint -->
    <script src="{% static 'core/js/theme.js' %}"></script>
    <!-- PWA manifest (Step 20) -->
    <link rel="manifest" href="{% static 'core/manifest.json' %}">

    <!-- Preconnect for Google Fonts (Phase 1, docs/19 #6) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Service worker version (Phase 1, docs/19 #24) -->
    <meta name="ff-sw-version" content="7">
    <!-- DEBUG flag for guarded logging (Phase 1, docs/19 #11) -->
    <script>window.ffDEBUG = {% if DEBUG %}true{% else %}false{% endif %};</script>
    <!-- Shared utility functions (Phase 1, docs/19 #21) -->
    <script defer src="{% static 'core/js/utils.js' %}"></script>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Unified dashboard.css with CSS-variable palette (Phase 4 docs/19 #16) -->
    <link rel="stylesheet" href="{% static 'core/css/dashboard.css' %}">

    <!-- Tailwind CSS: bubbly look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        flamingo: '#FF5E9A',
                        'flamingo-dark': '#D83A73',
                        slate: { 850: '#151e2e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-app); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hidden { display: none !important; }

        .stat-clickable { cursor: pointer; }

        /* Mobile browser chrome: use dynamic/small viewport height */
        body { height: 100dvh !important; height: 100svh !important; background-color: var(--bg-outer); color: var(--text-main); }

        /* Leagues sub-tabs */
        .leagues-tabs { background: var(--bg-light) !important; border: 1px solid var(--border-color) !important; }
        .leagues-tab { color: var(--text-muted) !important; background: transparent !important; border: none !important; transition: all 0.15s ease; }
        .leagues-tab:hover { color: var(--text-main) !important; }
        .leagues-tab.active { background: var(--border-color) !important; color: var(--text-main) !important; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2) !important; }

        /* Modals & explainer popups */
        .modal-overlay { display: none; opacity: 0; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.show-modal { display: flex; opacity: 1; }
        .modal-content { background-color: var(--bg-light) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important; }
        .modal-title, .modal-desc { color: var(--text-main) !important; }

        /* Stat explainer modal */
        .stat-modal-content { background: var(--bg-light) !important; color: var(--text-main) !important; border: 1px solid var(--border-color) !important; }
        .stat-modal-title { color: var(--text-main) !important; }
        .stat-modal-desc { color: var(--text-muted) !important; }
        .stat-acc { background: var(--bg-app) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 14px !important; margin-bottom: 8px !important; }
        .stat-acc-head { color: var(--text-main) !important; font-weight: 700 !important; }
        .stat-acc-head:hover { background: rgba(255, 255, 255, 0.05) !important; }
        .stat-acc-count { background: var(--border-color) !important; color: var(--text-muted) !important; border-radius: 9999px !important; }
        .stat-acc-body { background: var(--bg-app) !important; color: var(--text-muted) !important; }
        .stat-fact-row { border-color: var(--border-color) !important; color: var(--text-muted) !important; }
        .stat-fact-value { color: var(--text-main) !important; font-weight: 800 !important; }
        .stat-howto { color: var(--text-muted) !important; }
        .stat-history-row { border-color: var(--border-color) !important; }
        .stat-history-label { color: var(--text-main) !important; font-weight: 700 !important; }
        .stat-history-detail, .stat-history-date { color: var(--text-muted) !important; }
        .stat-show-more { color: #FF5E9A !important; background: transparent !important; }
        .stat-modal-empty { color: var(--text-muted) !important; }

        /* Buttons */
        .btn-flamingo { background-color: var(--primary-pink, #FF5E9A) !important; color: #ffffff !important; border-bottom: 4px solid var(--dark-pink, #D83A73) !important; }
        .friend-picker-content { background: var(--bg-light) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; }
        .friend-picker-row { background: var(--bg-app) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 14px !important; }
        .friend-picker-row:hover { border-color: #FF5E9A !important; }
        .milestone-toast { opacity: 0; }
        .milestone-toast.show { opacity: 1; }
    </style>

    <!-- Lazy-load feature controller URLs (Phase 1, docs/19 #4) -->
    <script>
        window.LAZY_SCRIPT_URLS = {
            shop: "{% static 'core/js/shop.js' %}",
            loadout: "{% static 'core/js/loadout.js' %}",
            battle: "{% static 'core/js/battle.js' %}",
            pvp: "{% static 'core/js/pvp.js' %}",
            badges: "{% static 'core/js/badges.js' %}",
            leagues: "{% static 'core/js/leagues.js' %}",
            stat_info: "{% static 'core/js/stat_info.js' %}"
        };
    </script>
</head>

<body class="bg-black text-slate-100 font-sans antialiased h-screen w-screen overflow-hidden flex justify-center">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md h-full bg-slate-900 flex flex-col relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">

        <!-- Top Nav (Stats) -->
        <header class="flex items-center justify-between p-4 bg-slate-900/95 backdrop-blur-md z-40 sticky top-0 border-b border-slate-700 shadow-sm">
            <div class="flex gap-2">
                <div class="stat-clickable stat-streak flex items-center gap-1.5 bg-slate-800 border border-slate-600 rounded-2xl px-3 py-1.5 cursor-pointer hover:bg-slate-700 transition-colors active:scale-95 shadow-inner"
                     id="stat-streak" data-stat="streak" role="button" tabindex="0" title="About your streak" onclick="showStatInfo('streak')">
                    <i class="fa-solid fa-fire text-orange-400"></i> <span class="font-bold text-slate-100">-</span>
                </div>
                <div class="stat-clickable stat-tokens flex items-center gap-1.5 bg-slate-800 border border-slate-600 rounded-2xl px-3 py-1.5 cursor-pointer hover:bg-slate-700 transition-colors active:scale-95 shadow-inner"
                     id="stat-tokens" data-stat="tokens" role="button" tabindex="0" title="About tokens" onclick="showStatInfo('tokens')">
                    <i class="fa-solid fa-coins text-yellow-400"></i> <span class="font-bold text-slate-100">-</span>
                </div>
                <div class="stat-clickable stat-stamina flex items-center gap-1.5 bg-slate-800 border border-slate-600 rounded-2xl px-3 py-1.5 cursor-pointer hover:bg-slate-700 transition-colors active:scale-95 shadow-inner"
                     id="stat-stamina" data-stat="stamina" role="button" tabindex="0" title="About stamina" onclick="showStatInfo('stamina')">
                    <i class="fa-solid fa-bolt text-yellow-400"></i> <span class="font-bold text-slate-100">-</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="{% url 'profile' %}" class="w-10 h-10 rounded-full bg-slate-700 border-2 border-slate-500 overflow-hidden active:scale-95 transition-transform shadow-sm inline-block" title="Edit profile picture">
                    <img class="w-full h-full object-cover rounded-full" id="avatar-img" alt="Avatar">
                </a>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="w-10 h-10 rounded-2xl bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-center hover:bg-red-500/20 active:scale-95 transition-colors" title="Log out">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>
        </header>

        <!-- Main Scrolling Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-10 relative" id="main-scroller">

            <div class="flex justify-center items-center py-2 text-slate-300 text-sm font-bold" id="loading-hint">
                <i class="fa-solid fa-spinner fa-spin mr-2 text-flamingo"></i> Syncing your flock...
            </div>
            <div class="hidden mx-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-sm font-bold text-center" id="error-hint"></div>

            <!-- Skill Tree -->
            <section class="relative py-8 px-4 flex flex-col gap-8 min-h-[560px] hidden" id="skill-tree">
                <!-- S-Curve connector SVG -->
                <svg class="skill-tree-path-svg absolute inset-0 w-full h-full pointer-events-none z-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" preserveAspectRatio="none">
                    <path class="skill-path-bg" d="M 300 50 C 200 80, 200 130, 200 150 C 200 170, 100 220, 100 250 C 100 280, 200 330, 200 350 C 200 370, 300 420, 300 450 C 300 480, 200 530, 200 560" />
                    <path class="skill-path-fg" id="skill-path-fg" d="M 300 50 C 200 80, 200 130, 200 150 C 200 170, 100 220, 100 250 C 100 280, 200 330, 200 350 C 200 370, 300 420, 300 450 C 300 480, 200 530, 200 560" />
                </svg>

                <!-- Row: Nutrition (Right) -->
                <div class="relative z-10 w-full flex justify-end pr-8">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-nutrition" onclick="loadNutrition()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-nutrition" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-green, #22c55e);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-green-500 border-b-[6px] border-green-700 text-white flex items-center justify-center text-3xl shadow-lg hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-apple-whole drop-shadow-md"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-nutrition">Lv 1</span>
                            <span class="node-badge-complete hidden" id="node-check-nutrition"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">Nutrition</span>
                    </button>
                </div>

                <!-- Row: Hydration (Center) -->
                <div class="relative z-10 w-full flex justify-center">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-hydration" onclick="loadHydration()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-hydration" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-cyan, #06b6d4);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-cyan-500 border-b-[6px] border-cyan-700 text-white flex items-center justify-center text-3xl shadow-lg hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-glass-water drop-shadow-md"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-hydration">Lv 1</span>
                            <span class="node-badge-complete hidden" id="node-check-hydration"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">Hydration</span>
                    </button>
                </div>

                <!-- Row: Endurance (Left) -->
                <div class="relative z-10 w-full flex justify-start pl-8">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-endurance" onclick="loadEndurance()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-endurance" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-blue, #3b82f6);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-blue-500 border-b-[6px] border-blue-700 text-white flex items-center justify-center text-3xl shadow-lg hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-bicycle drop-shadow-md"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-endurance">Lv 1</span>
                            <span class="node-badge-complete hidden" id="node-check-endurance"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">Endurance</span>
                    </button>
                </div>

                <!-- Row: Strength (Center) -->
                <div class="relative z-10 w-full flex justify-center">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-strength" onclick="loadStrength()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-strength" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-pink, #FF5E9A);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-flamingo border-b-[6px] border-flamingo-dark text-white flex items-center justify-center text-3xl shadow-lg hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-dumbbell drop-shadow-lg"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-strength">Lv 1</span>
                            <span class="node-badge-complete hidden" id="node-check-strength"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">Strength</span>
                    </button>
                </div>

                <!-- Row: Recovery (Right) -->
                <div class="relative z-10 w-full flex justify-end pr-8">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-recovery" onclick="loadRecovery()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-recovery" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-green, #10b981);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-emerald-500 border-b-[6px] border-emerald-700 text-white flex items-center justify-center text-3xl shadow-lg hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-bed drop-shadow-md"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-recovery">Lv 1</span>
                            <span class="node-badge-complete hidden" id="node-check-recovery"><i class="fa-solid fa-check"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">Recovery</span>
                    </button>
                </div>

                <!-- Row: Boss (Center) -->
                <div class="relative z-10 w-full flex justify-center">
                    <button class="group flex flex-col items-center bg-transparent border-0 p-0" id="node-boss" onclick="loadBoss()">
                        <div class="node-wrapper relative inline-flex items-center justify-center">
                            <svg class="node-ring-svg w-[92px] h-[92px] -rotate-90 pointer-events-none absolute" viewBox="0 0 100 100">
                                <circle class="node-ring-bg" cx="50" cy="50" r="44" />
                                <circle class="node-ring-fg" id="node-ring-boss" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" style="stroke: var(--primary-purple, #9333ea);" />
                            </svg>
                            <div class="node-circle w-20 h-20 rounded-full bg-purple-600 border-b-[6px] border-purple-800 text-white flex items-center justify-center text-3xl shadow-lg relative hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all">
                                <i class="fa-solid fa-crown text-yellow-300 absolute -top-4 -right-2 text-2xl rotate-12 drop-shadow-lg"></i>
                                <i class="fa-solid fa-skull drop-shadow-md"></i>
                            </div>
                            <span class="node-badge-level" id="node-lvl-boss">Boss</span>
                            <span class="node-badge-complete hidden" id="node-check-boss"><i class="fa-solid fa-trophy"></i></span>
                        </div>
                        <span class="mt-2 text-sm font-black text-slate-200 tracking-wide drop-shadow-sm">PR Boss</span>
                    </button>
                </div>
                <!-- Active campaign / what to focus on to beat the boss (dashboard.js) -->
                <div class="relative z-10 w-full mt-6" id="path-campaign-focus"></div>
            </section>

            <!-- Panel views are lazy-loaded on demand from /panel/<name>/ (docs/19 #12) -->
        </main>

        <!-- Bottom Tab Nav (Duolingo styled, tactile & space optimized) -->
        <nav class="bottom-nav w-full">
            <div class="bottom-nav-container relative">
                <!-- Path -->
                <a href="#/" class="nav-item active" id="nav-path" onclick="showPath(); return false;">
                    <div class="nav-icon-wrap"><i class="fa-solid fa-map-location-dot"></i></div>
                    <span class="nav-label">Path</span>
                </a>
                <!-- Leagues -->
                <a href="#/leagues" class="nav-item" id="nav-leagues" onclick="loadLeagues(); return false;">
                    <div class="nav-icon-wrap"><i class="fa-solid fa-shield-halved"></i></div>
                    <span class="nav-label">Leagues</span>
                </a>
                <!-- Badges -->
                <a href="#/badges" class="nav-item" id="nav-badges" onclick="loadBadges(); return false;">
                    <div class="nav-icon-wrap"><i class="fa-solid fa-medal"></i></div>
                    <span class="nav-label">Badges</span>
                </a>
                <!-- Game Hub Button -->
                <div class="flex items-center justify-center" id="game-btn-wrap">
                    <button class="nav-game-fab-btn" id="nav-game" onclick="toggleGameMenu(event); return false;" aria-haspopup="true" aria-expanded="false" aria-label="Game menu">
                        <div class="nav-icon-wrap game-fab"><i class="fa-solid fa-dice-d6"></i></div>
                        <span class="nav-label">Game</span>
                    </button>
                </div>

                <!-- Centered Duolingo-style 4-Row Game Hub Card -->
                <div id="game-menu" class="duo-game-menu hidden" role="menu" aria-label="Game menu">
                    <div class="duo-menu-header flex items-center justify-between pb-2 mb-2 border-b border-slate-700/60">
                        <span class="text-[11px] font-black uppercase tracking-wider text-slate-400">Game Modes</span>
                        <span class="text-[11px] font-bold text-flamingo flex items-center gap-1"><i class="fa-solid fa-sparkles text-xs"></i> Select Mode</span>
                    </div>
                    <div class="flex flex-col gap-2">
                        <!-- Shop -->
                        <button class="duo-row-item" role="menuitem" onclick="gotoGame('loadShop'); return false;">
                            <div class="duo-row-icon bg-amber-500/20 text-amber-400 border border-amber-500/30">
                                <i class="fa-solid fa-basket-shopping"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <div class="duo-row-title text-white">Shop</div>
                                <div class="duo-row-sub text-slate-400">Gacha packs &amp; gear catalog</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-500 text-xs mr-1"></i>
                        </button>
                        <!-- Gear / Inventory -->
                        <button class="duo-row-item" role="menuitem" onclick="gotoGame('loadLoadout'); return false;">
                            <div class="duo-row-icon bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                                <i class="fa-solid fa-shirt"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <div class="duo-row-title text-white">Inventory</div>
                                <div class="duo-row-sub text-slate-400">Equip gear &amp; manage loadout</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-500 text-xs mr-1"></i>
                        </button>
                        <!-- Battle / Boss -->
                        <button class="duo-row-item" role="menuitem" onclick="gotoGame('loadBattle'); return false;">
                            <div class="duo-row-icon bg-purple-500/20 text-purple-400 border border-purple-500/30">
                                <i class="fa-solid fa-dragon"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <div class="duo-row-title text-white">Boss Raids</div>
                                <div class="duo-row-sub text-slate-400">Campaign co-op battles</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-500 text-xs mr-1"></i>
                        </button>
                        <!-- PvP Arena -->
                        <button class="duo-row-item" role="menuitem" onclick="gotoGame('loadPvP'); return false;">
                            <div class="duo-row-icon bg-rose-500/20 text-rose-400 border border-rose-500/30">
                                <i class="fa-solid fa-fist-raised"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <div class="duo-row-title text-white">PvP Arena</div>
                                <div class="duo-row-sub text-slate-400">Duel players in async combat</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-500 text-xs mr-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="milestone-toast fixed top-4 left-1/2 -translate-x-1/2 bg-flamingo text-white px-4 py-2.5 rounded-2xl font-bold shadow-[0_8px_30px_rgba(255,94,154,0.4)] z-[999] pointer-events-none" id="milestone-toast">Base Level Up!</div>

    <!-- Action modal (dashboard.js uses #actionModal / #modal-title / #modal-desc / #modal-action) -->
    <div class="modal-overlay" id="actionModal">
        <div class="modal-content rounded-[2rem] p-6 border border-slate-600 shadow-2xl w-[90%] max-w-sm m-auto">
            <div class="sheet-handle"></div>
            <div class="flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-slate-700 rounded-full flex items-center justify-center text-4xl text-flamingo mb-5 border-4 border-slate-800 shadow-inner">
                    <i class="fa-solid fa-dumbbell drop-shadow-md"></i>
                </div>
                <h2 class="text-2xl font-black text-white mb-3 leading-tight drop-shadow-sm" id="modal-title">Title</h2>
                <p class="text-slate-300 font-semibold mb-8 leading-relaxed" id="modal-desc">Description goes here.</p>
                <button class="w-full bg-flamingo text-white font-bold py-4 rounded-2xl border-b-4 border-flamingo-dark hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all shadow-lg" id="modal-action" type="button">Log via Liftosaur</button>
            </div>
        </div>
    </div>

    <!-- Stat explainer modal (opened by clicking a top-nav stat badge) -->
    <div class="modal-overlay" id="statModal">
        <div class="modal-content stat-modal-content rounded-[2rem] p-6 border border-slate-600 shadow-2xl w-[90%] max-w-sm m-auto">
            <div class="sheet-handle"></div>
            <div class="modal-icon stat-modal-icon flex items-center justify-center w-20 h-20 mx-auto bg-slate-700 rounded-full text-4xl mb-4 border-4 border-slate-800 shadow-inner" id="stat-modal-icon">
                <i class="fa-solid fa-fire"></i>
            </div>
            <h2 class="modal-title text-2xl font-black text-white text-center mb-2" id="stat-modal-title">Streak</h2>
            <div class="stat-modal-value text-3xl font-black text-center mb-3" id="stat-modal-value">-</div>
            <p class="modal-desc stat-modal-desc text-slate-300 font-semibold text-center mb-4" id="stat-modal-desc">-</p>
            <div class="stat-modal-body" id="stat-modal-body"></div>
            <button class="btn-flamingo stat-modal-close w-full bg-flamingo text-white font-bold py-3.5 rounded-2xl border-b-4 border-flamingo-dark hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all shadow-lg" onclick="closeStatModal()" type="button">Got it!</button>
        </div>
    </div>

    <!-- Generic friend picker modal (Phase 8: base staffing + flock invites) -->
    <div class="modal-overlay" id="friendPickerModal">
        <div class="modal-content friend-picker-content rounded-[2rem] p-6 border border-slate-600 shadow-2xl w-[90%] max-w-sm m-auto">
            <div class="sheet-handle"></div>
            <h2 class="text-2xl font-black text-white mb-3" id="friend-picker-title">Pick a friend</h2>
            <div class="friend-picker-list" id="friend-picker-list"></div>
            <button class="w-full bg-flamingo text-white font-bold py-3.5 rounded-2xl border-b-4 border-flamingo-dark hover:brightness-110 active:border-b-0 active:translate-y-1 transition-all shadow-lg" onclick="closeFriendPicker()" type="button">Cancel</button>
        </div>
    </div>

    <!-- CDN scripts: async (order independent, Phase 1 docs/19 #3) -->
    <script async src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Chart.js (local bundle + CDN fallback) powers the skill-tree Graph views -->
    <script src="{% static 'core/js/chart.umd.min.js' %}"></script>
    <script async src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    {% compress js %}
    <!-- Core controllers (deferred: load in order after HTML parse, Phase 1 docs/19 #3) -->
    <script defer src="{% static 'core/js/router.js' %}"></script>
    <script defer src="{% static 'core/js/dashboard.js' %}"></script>
    <script defer src="{% static 'core/js/insights.js' %}"></script>
    <script defer src="{% static 'core/js/modality-factory.js' %}"></script>
    <!-- Modality controllers (deferred) -->
    <script defer src="{% static 'core/js/nutrition.js' %}"></script>
    <script defer src="{% static 'core/js/hydration.js' %}"></script>
    <script defer src="{% static 'core/js/endurance.js' %}"></script>
    <script defer src="{% static 'core/js/strength.js' %}"></script>
    <script defer src="{% static 'core/js/boss.js' %}"></script>
    <script defer src="{% static 'core/js/recovery.js' %}"></script>
    {% endcompress %}

    <!-- Lazy-loaded feature controllers are fetched on-demand via window.loadScript() -->
    <!-- SW registration (guarded logging, Phase 1 docs/19 #11) -->
    <script>
        // Register the service worker for offline/instant loading (Step 20).
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register("{% static 'core/service-worker.js' %}")
                .then(function (reg) { window.ffLog('SW registered:', reg.scope); })
                .catch(function (err) { window.ffWarn('SW registration failed:', err); });
        }
    </script>
</body>
</html>
