<section class="hidden p-4 min-h-full bg-slate-900" id="badges-view">
    <div class="flex items-center gap-4 mb-4 sticky top-0 bg-slate-900/95 backdrop-blur-sm py-3 z-20 border-b border-slate-800" id="badges-sticky-header">
        <button class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-600 text-slate-200 flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-all shadow-sm" id="badges-back" onclick="backToBadgesPlan()" aria-label="Back to Plan">
            <i class="fa-solid fa-arrow-left text-xl"></i>
        </button>
        <h2 class="text-2xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-medal text-yellow-400"></i> Badges
        </h2>
    </div>

    <div id="badges-content"></div>

    <!-- Empty / Link-Provider CTA -->
    <div id="badges-empty" class="hidden">
        <div class="flex flex-col items-center justify-center text-center mt-4 p-8 bg-slate-800 rounded-[2rem] border border-slate-600 shadow-xl">
            <div class="w-24 h-24 bg-slate-700 rounded-full flex items-center justify-center text-5xl text-yellow-500/50 mb-6 border-4 border-slate-800 shadow-inner">
                <i class="fa-solid fa-medal"></i>
            </div>
            <p class="text-xl font-bold text-white mb-3">No badges yet.</p>
            <p class="text-slate-300 font-semibold mb-8 leading-relaxed">Keep logging activities and leveling up - earned badges appear here.</p>
        </div>
    </div>

    <!-- Duolingo Achievement Modal Container -->
    <div id="badges-modal-root"></div>
</section>
