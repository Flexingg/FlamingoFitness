services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    # Map to 5433 on the host to avoid clashing with any local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Probe the actual app database so this stays healthy (not just the
      # default user-named database, which does not exist).
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flamingo} -d ${POSTGRES_DB:-flamingo_fitness}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flamingofitness
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - flamingofitness
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py create_demo_accounts &&
             gunicorn flamingo_fitness.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamingofitness
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A flamingo_fitness worker -l INFO
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamingofitness
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build: .
    restart: unless-stopped
    command: celery -A flamingo_fitness beat -l INFO
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flamingofitness
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  flamingofitness:
